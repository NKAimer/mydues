[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mydues"
version = "0.1.0"
description = "Track Indian credit card dues from statement emails"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.180",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.2",
    "pikepdf>=9.5",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "Flask>=3.1",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[project.scripts]
mydues = "mydues.cli:main"

[tool.setuptools.packages.find]
include = ["mydues*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
